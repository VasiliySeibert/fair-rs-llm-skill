name: Package and helper checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
        yaml: [with-yaml, without-yaml]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional YAML parser
        if: matrix.yaml == 'with-yaml'
        run: python -m pip install -r requirements-dev.txt
      - name: Check package and links
        run: python tools/validate_package.py
      - name: Test helpers and installation
        run: python -m unittest discover -s tests -v
